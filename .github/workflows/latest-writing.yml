# Refreshes the "Latest entries" list in README.md from lscythe.dev's feed.
name: Latest writing

on:
  schedule:
    - cron: "0 0 * * *" # daily, 07:00 in Jakarta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://lscythe.dev/rss.xml"
          max_post_count: 5
          date_format: "UTC:yyyy.mm.dd"
          template: "- `$date` · [$title]($url)$newline"
          commit_message: "Update latest writing from lscythe.dev"
